apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsecure-api-deployment
  namespace: default
  labels:
    app: finsecure-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finsecure-api
  template:
    metadata:
      labels:
        app: finsecure-api
    spec:
      containers:
      - name: transaction-api
        image: finsecure-api:v1.0.0
        imagePullPolicy: Never # Forces Minikube/Docker-Desktop to use your locally built image
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: finsecure-api-config
        
        # Readiness Probe: Ensures the container is fully initialized before receiving traffic
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        
        # Liveness Probe: Automatically restarts the container if the Python API freezes
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: finsecure-api-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: finsecure-api
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080 # Exposes the cluster application explicitly on your machine's port 30080
